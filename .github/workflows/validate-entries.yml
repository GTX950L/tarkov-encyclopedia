name: Validate Entries

# 校验有两道：
#   - pull request → 本 workflow 拦截（不部署）
#   - push 到 main → 由 deploy-pages.yml 的 validate job 前置拦截，通过才允许部署
on:
  pull_request:
  workflow_dispatch:

jobs:
  check-internal-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run consistency checks
        run: python scripts/check_entries.py

      - name: Check agent manual consistency
        run: python scripts/skills_consistency.py

      # 物品数值一致性：既有图鉴条目与物品图鉴的同一件物品，数值是否还对得上。
      # ⚠️ 它需要 items_full.json 缓存（不入仓），所以这一条自己抓一次数据源。
      #    数据源结构变了、或某篇条目写错了数，这里就会红。
      # 顺序有讲究：**先生成，后核对**（与 deploy-pages.yml 的 validate job 一致）。
      # gen_items_catalog --fetch 会把数据抓下来放进 scripts/data/items_full.json，
      # 后面两步都复用它 —— 抓三遍数据和抓一遍，结果一样但时间差好几倍。
      - name: Generate item catalog
        run: python scripts/gen_items_catalog.py --fetch

      - name: Generate quest item index
        run: python scripts/gen_quest_carrier.py

      # 物品→图鉴映射是否跟上图鉴数据：跑完生成器若文件有变化，说明有人改了
      # 图鉴（或改了 recipes）却没重跑这一步 —— 那会让任务页静默留下旧链接。
      # ⚠️ 只查**入仓**的那两份；catalog-data.js 在 .gitignore 里，对它做
      #    git diff 永远为空，等于没查。
      - name: Check item link wiring
        run: |
          git diff --exit-code content/javascripts/items_index.js                                scripts/data/item_pages.json

      - name: Check item value consistency
        run: python scripts/check_catalog_consistency.py
