name: Validate Entries

# 校验有两道：
#   - pull request → 本 workflow 拦截（不部署）
#   - push 到 main → 由 deploy-pages.yml 的 validate job 前置拦截，通过才允许部署
on:
  pull_request:
  workflow_dispatch:

jobs:
  check-internal-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run consistency checks
        run: python scripts/check_entries.py
