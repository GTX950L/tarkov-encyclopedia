name: Deploy GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run consistency checks
        run: python scripts/check_entries.py

      - name: Check icon semantics table
        run: python scripts/check_icons.py

      - name: Check citation promises
        run: python scripts/check_promises.py

      - name: Check agent manual consistency
        run: python scripts/skills_consistency.py

      - name: Check item value consistency
        run: python scripts/check_catalog_consistency.py --fetch

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate glossary data
        run: python scripts/build_glossary.py

      # 物品图鉴（第九篇）：先抓数据再生成，两步都要。
      # ⚠️ 生成器内有七道对账，不过就退出码 1 —— CI 因此顺带验证了
      # 「数据源结构没变、分类清单仍闭合」，而不只是「构建没报错」。
      - name: Fetch item catalog data
        run: python scripts/gen_items_catalog.py --fetch

      - name: Generate item catalog
        run: python scripts/gen_items_catalog.py

      - name: Build site
        run: zensical build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
