name: Deploy GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run consistency checks
        run: python scripts/check_entries.py

      - name: Check icon semantics table
        run: python scripts/check_icons.py

      - name: Check citation promises
        run: python scripts/check_promises.py

      - name: Check agent manual consistency
        run: python scripts/skills_consistency.py

      # 前端脚本结构：重复定义 / 死代码 / 全局泄漏。
      # 为什么这不是「代码品味」：2026-10-18 审查在 ops-board.js 里抓到
      # bindMapToRight() 被逐字复制两份、buildRight() 39 行没人调用 ——
      # 构建不报错、页面能打开 —— 当时那七道门禁一道都看不见。
      - name: Lint handwritten scripts
        run: python scripts/check_js_lint.py

      # 单测：纯函数 + 内容级不变量 + 产物冒烟。约 2 秒，不需要浏览器。
      # 只装 dev 依赖（pytest），不污染部署用的 requirements.txt。
      - name: Run unit tests
        run: |
          pip install -r requirements-dev.txt
          python -m pytest tests -q

      # ⚠️ 顺序：**先抓一次数据、再跑三个用它/查它的步骤**。
      # 抓三遍和抓一遍结果一样，时间差好几倍。
      - name: Generate item catalog
        run: python scripts/gen_items_catalog.py --fetch

      - name: Generate quest item index
        run: python scripts/gen_quest_carrier.py

      # 物品→图鉴映射是否跟上图鉴数据：跑完生成器若入仓文件有变化，说明有人
      # 改了图鉴（或 recipes）却没重跑这一步 —— 那会让线上留下**过期的物品链接**。
      # ⚠️ 只查入仓的两份；catalog-data.js 在 .gitignore 里，对它 git diff 恒为空。
      - name: Check item link wiring
        run: |
          git diff --exit-code content/javascripts/items_index.js                                scripts/data/item_pages.json

      - name: Check item value consistency
        run: python scripts/check_catalog_consistency.py

      # 生成物防漂移：重跑全部**离线可复现**的生成器，看产物有没有跟上源。
      # 为什么需要它：`gen_*.py` 的产物是入库的，**改了源或生成器却忘了重跑**
      # 不会让构建失败、也不会让上面任何一道门禁变红 —— 线上就一直留着旧产物。
      # 实测（2026-10-11）：干净工作区重跑一遍，12 个文件与仓库不一致。
      # ⚠️ 放在最后：它要重跑 24 支生成器（约 20 秒），且会改写产物文件。
      - name: Check generator drift
        run: python scripts/check_gen_drift.py

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Generate glossary data
        run: python scripts/build_glossary.py

      # 物品图鉴（第九篇）：先抓数据再生成，两步都要。
      # ⚠️ 生成器内有七道对账，不过就退出码 1 —— CI 因此顺带验证了
      # 「数据源结构没变、分类清单仍闭合」，而不只是「构建没报错」。
      - name: Fetch item catalog data
        run: python scripts/gen_items_catalog.py --fetch

      - name: Generate item catalog
        run: python scripts/gen_items_catalog.py

      # ⚠️ **必须在 gen_items_catalog 之后**：物品名 → 图鉴位置的映射
      # （scripts/data/item_pages.json）由上一步产出，本步读它把物品名变成链接。
      # 顺序错了不会报错，只会**静默出一份没有链接的任务物品索引** ——
      # 所以本步也自己会检查映射是否存在，缺失时打印警告。
      - name: Generate quest item index
        run: python scripts/gen_quest_carrier.py

      - name: Build site
        run: zensical build

      # 体积预算：把「弱网可读」从口号变成会红的数字。
      # 超预算时要么优化，要么**同时**改这里的预算并写明理由 —— 不允许静默超标。
      - name: Check size budgets
        run: python scripts/check_budget.py

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
