theme:
  name: material
  # 自定义 404 页只存在于这里（overrides/404.html）。
  # ⚠️ 不能用 content/404.md —— Zensical 把 404.html 当主题的 static_template
  #    （zensical/config.py:510），Markdown 版的 404.md 只会被当成一篇普通文档、
  #    生成一个游离的 /404/ 页，既不是错误页也不在 nav 里。理由写在模板头部。
  custom_dir: overrides
  language: zh
  favicon: assets/favicon.svg
  icon:
    logo: material/crosshairs
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - navigation.sections
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  # palette 用 custom 而不是预设色名（如 indigo）
  # —— 这样主题不会给 <html> 加 [data-md-color-primary=indigo] 这类属性选择器，
  #    配色变量改由 content/stylesheets/extra.css 定义（塔科夫「军用档案纸」色板）。
  #    若改回预设色名，extra.css 里的 --md-primary-fg-color 会被主题自带的
  #    同特异性规则压掉，页头会退回 Material 蓝。
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换亮色模式

markdown_extensions:
  # ⚠️ md_in_html 用来支持「在原始 HTML 块里写 Markdown」——
  # 目前两处用到：
  #   ① 物品图鉴的每个分类大表被包进
  #      `<div data-search-exclude markdown>`，目的是把这些几千行的表格
  #      **排除出全文搜索索引**（它们占了索引的 39%，见 scripts/gen_items_catalog.py）；
  #   ② 任务图鉴各商人页的索引表被包进 `<details markdown="1">` 做默认折叠
  #      （见 scripts/gen_quests.py 的 write_trader_page）。
  # 没有这个扩展，块里的 Markdown **不会被解析**，表格会退化成纯文本（实测过）。
  #
  # 边界：**只有带 markdown 属性的块才会被解析**，站内既有的
  # `<div id="tk-...">` 一类原始 HTML 块行为不变（已逐页比对产物确认）。
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - footnotes
  - toc:
      permalink: true

plugins:
  - search:
      lang: zh

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/GTX950L/tarkov-encyclopedia

extra_css:
  - stylesheets/extra.css

extra_javascript:
  # ⚠️ 术语数据**必须排在 bundle.js 前面**：bundle 里的 glossary-tooltip.js 读
  #    window.TARKOV_TERMS。该文件**未入仓**（.gitignore 第 11 行），由
  #    build_glossary.py 在构建期生成，deploy job 里跑在 zensical build 之前。
  - javascripts/terms-data.js
  # 全局手写脚本**打包成一个**（2026-10-27）。原来是 13 个 <script src>，
  # 各带一份 gzip 字典 —— 而它们讲的是同一批词汇（siteRoot / document$ /
  # tk- 前缀 / 那一串 querySelector）。实测 74.46 → 68.67 KB，净省 5.79 KB。
  # 这块成本**每页、每次打开都付**（170 页 × 每次访问），所以省下来的是真金白银：
  # 弱 3G 下每页少等约 0.5 s。
  #
  # 由 scripts/gen_bundle.py 生成并**入仓**；改了下面任一源文件都必须重跑它
  # （⑤c 生成物防漂移会查）。源文件仍留在同目录，各段以 `==== 源文件：x.js ====`
  # 分隔，方便出错时就地定位。
  #    scroll-fix / glossary-tooltip / search-ready / breadcrumb / nav-top /
  #    progress-manifest / progress / quest-needs / table-sticky / toolbox
  # 两条单独说明保留在这里（细节在各文件头注释）：
  #   · quest-needs.js —— 物品需求判定（读进度），物品反查页与图鉴单件页共用
  #     同一份，避免两套口径；
  #   · table-sticky.js —— 长表表头吸顶，只对 ≥15 行的表生效，脚本自己找表，
  #     没有表就什么都不做（为什么不能纯 CSS，见脚本头注释）。
  - javascripts/bundle.js
  # ⚠️ 下面两个 loader **不能并进 bundle**（2026-10-27 实测算过，省 2.7 KB 不值得）：
  #    两者都靠 document.currentScript.src 反推同目录地址
  #    （`src.replace(/map-loader\.js/, "map.js")`）。并进 bundle 后
  #    currentScript 指向 bundle.js，正则匹配不到，注入地址还是 bundle.js 自己
  #    —— 无限自注入。这与 2026-10-19「左右栏全空」是同一类故障（那次是内联
  #    script 先于 extra_javascript 执行、DOM 里没有 javascripts/*.js 可反推），
  #    所以各自保留、各付约 1.3 KB。
  #
  #    ⚠️ 地图脚本**不在这里直接加载**：map.js 约 93 KB（gzip 32 KB），
  #    只有带 #tk-map 的地图页需要。map-loader.js 检测到挂载点才注入它，
  #    其余 150 多页不再为地图付下载（2026-10-17）。
  - javascripts/map-loader.js
  # ⚠️ ops-board.js 也**不在这里**：约 48 KB（gzip 16 KB），全场只有 /ops/ 需要。
  #    留在这里 = 其余 166 页每页为它付一次下载（2026-10-18 实测：每页 JS 294 → 246 KB）。
  #    与地图同一套做法：mount-loader.js 检测到 #tk-ops 才注入。
  #    ⚠️ 别改回「在 ops/index.md 里写内联 script 注入」：正文里的脚本先于
  #    body 末尾的 extra_javascript 执行，那时 DOM 里没有任何 javascripts/*.js 可反推地址，
  #    加载器只能静默退出（左/右栏全空，实测过）。
  #    首页作战台（home-ops.js，gzip 3.5 KB）走同一个加载器：看到 #tk-home-ops 才注入。
  #    它曾在 2026-10-19 挂在这里一分钟 —— 每页 JS 立刻被顶到 76 KB，越过 74 KB 预算线。
  - javascripts/mount-loader.js

