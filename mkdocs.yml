site_name: 逃离塔科夫百科全书
site_description: 系统性介绍《逃离塔科夫》地图、机制、装备与经济系统的中文开源百科
site_url: https://gtx950l.github.io/tarkov-encyclopedia/
repo_url: https://github.com/GTX950L/tarkov-encyclopedia
repo_name: GTX950L/tarkov-encyclopedia
docs_dir: content
edit_uri: edit/main/content/

copyright: >-
  本站为非官方粉丝资料站，与 Battlestate Games 无隶属或合作关系；「Escape from Tarkov」及相关名称、标志与游戏内容的商标权与著作权归 Battlestate Games 及其关联方所有。站内文字以 <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/deed.zh" target="_blank" rel="license noopener">CC BY-NC-SA 4.0</a> 授权。

theme:
  name: material
  language: zh
  favicon: assets/favicon.svg
  icon:
    logo: material/crosshairs
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - navigation.indexes
    - navigation.sections
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
  # palette 用 custom 而不是预设色名（如 indigo）
  # —— 这样主题不会给 <html> 加 [data-md-color-primary=indigo] 这类属性选择器，
  #    配色变量改由 content/stylesheets/extra.css 定义（塔科夫「军用档案纸」色板）。
  #    若改回预设色名，extra.css 里的 --md-primary-fg-color 会被主题自带的
  #    同特异性规则压掉，页头会退回 Material 蓝。
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换暗色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换亮色模式

markdown_extensions:
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - admonition
  - footnotes
  - toc:
      permalink: true

plugins:
  - search:
      lang: zh

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/GTX950L/tarkov-encyclopedia

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/terms-data.js
  - javascripts/scroll-fix.js
  - javascripts/glossary-tooltip.js
  - javascripts/search-ready.js
  - javascripts/breadcrumb.js

