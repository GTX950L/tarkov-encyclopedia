          # 竞技场栏目（v1.144.0）：由单页扩为 4 页。总览承接原来的介绍，
          # 另三页分别管「模式与场地」「段位/通行证/预设」「练技能」——
          # 最后一页是这次扩栏目的主因：竞技场是站内唯一能低成本练战斗类技能的场所。
          - 竞技场:
              - 总览: entries/arena.md
              - 模式与场地: entries/arena-modes.md
              - 段位·通行证·预设: entries/arena-progress.md
              - 练技能手册: entries/arena-training.md
          - PvE 模式: entries/pve.md
          - EXFIL Brothers 计划: entries/exfil-brothers.md
          - 限时事件与活动: entries/limited-events.md
      - 第八篇 · 世界与背景:
          # 天气与光照 2026-10-22 移入第五篇（机制同类）；这里只留「设定读物」两篇。
          - 彩蛋与设计陷阱: entries/easter-eggs.md
          - 世界观与阵营背景: entries/worldview.md
  # ── 顶层三分（2026-10-22）────────────────────────────────────────────
  # 为什么不是「百科条目 / 查阅栏目」：首页第一屏承诺的是「📖 读 / 🧰 用」两件事，
  # 而原来的侧栏只有「读」。8 个工具散在 5 个篇里 —— 作战台单挂顶层、我的进度与
  # 物品反查在第十篇、交互地图在第十二篇、配方 / 术语 / 机制速查在第十一篇。
  # 战区纪事（v1.148）：**不占篇目的叙事栏目**，与「用 · 工具箱」同级、不编号。
  # 为什么不进「第二篇 · 地图」：check_entries 4a 判定「内容篇」的依据是
  # 「该篇的页面是否全在 entries/ 下」—— 往第二篇塞两个 lore/ 页面，
  # 第二篇立刻从内容篇降级为栏目，内容篇之和 93 → 79，连带首页速览与路径图全红（实测过）。
  # 为什么不编成「第十三篇」：它只有 2 页、且是地图的第二层读法（同一片区域换个问法），
  # 单独编号会让「分十二篇」的四处声明、路径图、llms 全动一遍，收益不抵成本。
  # 代价说清楚：它**不进** path card 与篇数统计，只在导航里出现 —— 这是有意的。
  - 战区纪事:
      - 总纲与读法: lore/index.md
      - 工业带（海关 · 工厂 · 储备站）: lore/industrial.md
      - 城区（街区 · 中心区 · 立交桥）: lore/urban.md
      - 郊野（海岸线 · 森林 · 灯塔）: lore/outskirts.md
      - 封闭设施（实验室 · 破冰船 · 迷宫 · 终点站）: lore/facilities.md

  # 读者要找一个工具，得先知道它被编纂时归到哪一篇，那是我们的分类法，不是他的。
  #
  # 「篇」的编号保留：它是 check_entries.py 的判据锚点（4b 篇数、路径图逐卡对账、
  # 内容篇之和）。取消编号要同时改四处判据与六处正文声明 —— 单独一个版本做，
  # 这次只把「读 / 用 / 查」摆到读者面前。
  - 用 · 工具箱:
      # 作战台（2026-10-18）：一站式工作面 —— 选图 / 搜任务 / 勾目标 / 定位 /
      # 出击清单全在同一屏，按 PvE → 赛季 → PvP 排序。三个工具页 + 交互地图
      # 集中在这里，与「读」并列而不是藏进某一篇。
      - 作战台（一站式）: ops/index.md
      # 我的进度 / 物品反查 2026-10-22 从第十篇移出：它们是工具（读同一份本机账本），
      # 不是任务数据的一部分。第十篇因此从 17 页降到 15 页。
